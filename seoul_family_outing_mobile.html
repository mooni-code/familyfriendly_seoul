  '마포구':[{name:'월드컵공원 환경체험학교',type:'교육',date:'주말 10:00~16:00',venue:'노을공원'},{name:'홍대 어린이 버스킹',type:'공연',date:'7~9월 매주 토',venue:'홍대 놀이터'}],
  '성동구':[{name:'서울숲 생태체험',type:'교육',date:'매월 셋째 토 10:00',venue:'서울숲'},{name:'뚝섬한강 물놀이장',type:'축제',date:'7/1~8/25',venue:'뚝섬한강공원'}],
  '노원구':[{name:'어린이 미술관 여름방학',type:'교육',date:'7~8월',venue:'노원 어린이미술관'}],
};

const TM={park:'공원·자연',kids:'키즈카페',culture:'문화·공연',play:'놀이시설'};
const TC={park:'tp-park',kids:'tp-kids',culture:'tp-culture',play:'tp-play'};
let curFilter='all', curPlaces=[], openId=null;

function setF(f,el){
  curFilter=f;
  document.querySelectorAll('.fchip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  renderList(curPlaces);
}

function getFiltered(pl){
  if(curFilter==='all') return pl;
  if(curFilter==='parking') return pl.filter(p=>p.parking);
  if(curFilter==='stroller') return pl.filter(p=>p.stroller);
  return pl.filter(p=>p.type===curFilter);
}

function doSearch(){
  const gu=document.getElementById('guSel').value;
  const age=document.getElementById('ageSel').value;
  let r=[...DB];
  if(gu) r=r.filter(p=>p.gu===gu);
  if(age!=='') r=r.filter(p=>p.ages.includes(parseInt(age)));
  curPlaces=r;
  renderList(r);
  updateStats(r);
  document.getElementById('statsGrid').style.display='grid';
  document.getElementById('resultBar').style.display='flex';
  const evSec=document.getElementById('eventSec');
  evSec.classList.add('show');
  document.getElementById('evDist').textContent=gu||'서울 전체';
  renderEvents(gu);
  closeDetail();
}

function renderList(pl){
  const f=getFiltered(pl);
  document.getElementById('rCount').textContent=f.length;
  if(!f.length){
    document.getElementById('placeList').innerHTML='<div class="empty"><i class="ti ti-mood-sad" aria-hidden="true"></i>해당 조건의 장소가 없습니다</div>';
    return;
  }
  document.getElementById('placeList').innerHTML=f.map(p=>`
    <div class="pcard${openId===p.id?' active':''}" onclick="openDetail(${p.id})" data-id="${p.id}">
      <div class="pcard-top">
        <span class="pname">${p.name}</span>
        <span class="ptyp ${TC[p.type]}">${TM[p.type]}</span>
      </div>
      <div class="ptags">
        ${p.parking?'<span class="ptag tok"><i class="ti ti-car" aria-hidden="true"></i>주차</span>':'<span class="ptag twarn"><i class="ti ti-car-off" aria-hidden="true"></i>주차불가</span>'}
        ${p.stroller?'<span class="ptag tok"><i class="ti ti-baby-carriage" aria-hidden="true"></i>유아차</span>':''}
        ${p.nursing?'<span class="ptag tok"><i class="ti ti-heart" aria-hidden="true"></i>수유실</span>':''}
        ${p.hospital?'<span class="ptag tok"><i class="ti ti-building-hospital" aria-hidden="true"></i>병원</span>':''}
        ${p.tags.slice(0,2).map(t=>`<span class="ptag">${t}</span>`).join('')}
      </div>
      <div class="paddr"><i class="ti ti-map-pin" style="font-size:11px" aria-hidden="true"></i> ${p.addr}</div>
    </div>
  `).join('');
}

function openDetail(id){
  const p=DB.find(x=>x.id===id);
  if(!p) return;
  openId=id;
  document.querySelectorAll('.pcard').forEach(c=>c.classList.remove('active'));
  const card=document.querySelector(`[data-id="${id}"]`);
  if(card){card.classList.add('active');}

  document.getElementById('dName').textContent=p.name;
  document.getElementById('dSub').textContent=`${p.gu} · ${TM[p.type]}`;

  const rows=[
    {ok:p.parking,icon:'ti-car',label:'주차장',yt:'이용 가능',nt:'주차 불가'},
    {ok:p.stroller,icon:'ti-baby-carriage',label:'유아차 대여',yt:'있음',nt:'미제공'},
    {ok:p.nursing,icon:'ti-heart',label:'수유실',yt:'있음',nt:'없음'},
    {ok:p.hospital,icon:'ti-building-hospital',label:'인근 소아과',yt:'있음',nt:'확인 필요'},
    {ok:p.yezkids,icon:'ti-mood-happy',label:'키즈존',yt:'예스키즈',nt:'노키즈'},
  ];
  document.getElementById('dInfoGrid').innerHTML=rows.map(r=>`
    <div class="icard">
      <div class="iico ${r.ok?'iico-ok':'iico-no'}">
        <i class="ti ${r.icon}" style="font-size:15px;color:${r.ok?'#2E7D32':'#E65100'}" aria-hidden="true"></i>
      </div>
      <div>
        <div class="i-label">${r.label}</div>
        <div class="i-val ${r.ok?'i-ok':'i-no'}">${r.ok?r.yt:r.nt}</div>
      </div>
    </div>
  `).join('');

  document.getElementById('dTags').innerHTML=p.tags.map(t=>`<span class="det-tag">${t}</span>`).join('');
  document.getElementById('dAddr').innerHTML=`<i class="ti ti-map-pin" style="font-size:12px" aria-hidden="true"></i> ${p.addr}`;

  const panel=document.getElementById('detPanel');
  panel.classList.add('show');
  panel.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function closeDetail(){
  openId=null;
  document.getElementById('detPanel').classList.remove('show');
  document.querySelectorAll('.pcard').forEach(c=>c.classList.remove('active'));
}

function updateStats(pl){
  document.getElementById('sP').textContent=pl.filter(p=>p.type==='park').length;
  document.getElementById('sK').textContent=pl.filter(p=>p.type==='kids').length;
  document.getElementById('sC').textContent=pl.filter(p=>p.type==='culture').length;
  document.getElementById('sPk').textContent=pl.filter(p=>p.parking).length;
  document.getElementById('sSt').textContent=pl.filter(p=>p.stroller).length;
  document.getElementById('sN').textContent=pl.filter(p=>p.nursing).length;
}

function renderEvents(gu){
  let evs=[];
  if(gu&&EVENTS[gu]) evs=EVENTS[gu];
  else Object.values(EVENTS).forEach(a=>evs.push(...a));
  evs=evs.slice(0,6);
  document.getElementById('evCards').innerHTML=evs.length
    ? evs.map(e=>`<div class="ecard"><span class="etype">${e.type}</span><div class="ename">${e.name}</div><div class="emeta"><i class="ti ti-calendar" style="font-size:11px" aria-hidden="true"></i> ${e.date}</div><div class="emeta" style="margin-top:2px"><i class="ti ti-map-pin" style="font-size:11px" aria-hidden="true"></i> ${e.venue}</div></div>`).join('')
    : '<span style="font-size:12px;color:var(--color-text-tertiary)">등록된 행사가 없습니다</span>';
}

doSearch();
</script>
