<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서울 가족 나들이 플래너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --g9:#1B4332;--g8:#2D6A4F;--g6:#40916C;--g4:#52B788;--g2:#95D5B2;--g1:#D8F3DC;--g0:#F0FDF4;
  --sky:#0EA5E9;--sky0:#E0F2FE;
  --amber:#D97706;--amber0:#FEF3C7;
  --purple:#7C3AED;--purple0:#EDE9FE;
  --red:#DC2626;--red0:#FEF2F2;
  --orange:#EA580C;--orange0:#FFF7ED;
  --teal:#0D9488;--teal0:#F0FDFA;
  --pink:#DB2777;--pink0:#FCE7F3;
  --indigo:#4F46E5;--indigo0:#EEF2FF;
  --txt1:#111827;--txt2:#4B5563;--txt3:#9CA3AF;
  --bg:#F8FAF9;--surf:#FFFFFF;--bdr:#E2EBE6;
  --r-sm:8px;--r-md:12px;--r-lg:16px;
}
html,body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--txt1);font-size:14px;line-height:1.6;}

/* ── HEADER ── */
.header{background:var(--g9);padding:0 24px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:300;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-mark{width:30px;height:30px;background:var(--g4);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.logo h1{color:#fff;font-size:15px;font-weight:700;}
.logo span{color:var(--g2);font-size:11px;margin-left:4px;}
.hpills{display:flex;gap:6px;}
.hpill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:11px;padding:2px 9px;border-radius:20px;display:flex;align-items:center;gap:3px;}
.search-inp{height:32px;border:1px solid rgba(255,255,255,.3);border-radius:var(--r-sm);padding:0 10px;font-size:12px;background:rgba(255,255,255,.12);color:#fff;font-family:inherit;width:210px;}
.search-inp::placeholder{color:rgba(255,255,255,.5);}
.search-inp:focus{outline:none;border-color:var(--g4);background:rgba(255,255,255,.18);}

/* ── HERO ── */
.hero{background:linear-gradient(135deg,var(--g9) 0%,var(--g8) 55%,var(--g6) 100%);padding:28px 24px 24px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='30' cy='30' r='1.5' fill='%23fff' fill-opacity='.04'/%3E%3C/svg%3E");}
.hero-inner{position:relative;}
.hero-title{color:#fff;font-size:22px;font-weight:700;margin-bottom:4px;}
.hero-sub{color:rgba(255,255,255,.7);font-size:13px;margin-bottom:20px;}
.gu-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;}
.gu-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.85);font-size:12px;padding:7px 4px;border-radius:var(--r-sm);cursor:pointer;text-align:center;transition:all .15s;font-family:inherit;line-height:1.3;}
.gu-btn:hover{background:rgba(255,255,255,.22);color:#fff;}
.gu-btn.active{background:var(--g4);border-color:var(--g4);color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(82,183,136,.4);}
.gu-btn small{display:block;font-size:9px;color:rgba(255,255,255,.55);margin-top:1px;}
.gu-btn.active small{color:rgba(255,255,255,.85);}

/* ── BREADCRUMB ── */
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--txt3);padding:9px 24px;background:var(--surf);border-bottom:1px solid var(--bdr);}
.bc-cur{color:var(--g8);font-weight:500;}

/* ── LAYOUT ── */
.layout{display:flex;}

/* ── SIDENAV ── */
.sidenav{width:196px;flex-shrink:0;background:var(--surf);border-right:1px solid var(--bdr);position:sticky;top:54px;height:calc(100vh - 54px);overflow-y:auto;display:flex;flex-direction:column;}
.snav-head{padding:14px 14px 8px;border-bottom:1px solid var(--bdr);}
.snav-gu{font-size:15px;font-weight:700;color:var(--g8);display:flex;align-items:center;gap:6px;}
.snav-total{font-size:11px;color:var(--txt3);margin-top:2px;}
.snav-items{padding:6px 0;flex:1;}
.snav-item{display:flex;align-items:center;gap:9px;padding:9px 14px;cursor:pointer;border-left:3px solid transparent;transition:all .12s;color:var(--txt2);font-size:13px;}
.snav-item:hover{background:var(--g0);color:var(--g8);}
.snav-item.on{background:var(--g0);color:var(--g8);border-left-color:var(--g4);font-weight:500;}
.snav-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.snav-badge{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:500;background:var(--g1);color:var(--g8);}
.snav-footer{margin-top:auto;padding:12px 14px;border-top:1px solid var(--bdr);}
.btn-back{width:100%;height:32px;border:1px solid var(--bdr);border-radius:var(--r-sm);background:none;color:var(--txt2);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-family:inherit;}
.btn-back:hover{background:var(--bg);}

/* ── CONTENT ── */
.content{flex:1;min-width:0;}
.content-inner{max-width:900px;padding:24px 24px 48px;}

/* ── SECTION ── */
.section{margin-bottom:36px;scroll-margin-top:70px;}
.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--g1);}
.sec-title{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;color:var(--g9);}
.sec-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.sec-count{font-size:12px;color:var(--txt3);}

/* ── CARDS ── */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px;}
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r-lg);padding:14px 16px 32px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);transform:translateY(-1px);border-color:var(--g2);}
.card-bar{position:absolute;top:0;left:0;right:0;height:3px;}
.card-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;margin-bottom:7px;}
.card-name{font-size:13px;font-weight:500;color:var(--txt1);margin-bottom:5px;line-height:1.4;}
.card-row{font-size:11px;color:var(--txt2);display:flex;align-items:flex-start;gap:5px;margin-bottom:3px;}
.card-row i{font-size:11px;flex-shrink:0;margin-top:1px;}
.card-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px;}
.ctag{font-size:10px;padding:2px 7px;border-radius:6px;background:var(--bg);color:var(--txt2);border:1px solid var(--bdr);}
.card-arrow{position:absolute;bottom:10px;right:12px;color:var(--txt3);font-size:13px;}

/* facility chips on cards */
.fchip{font-size:10px;padding:2px 7px;border-radius:6px;display:inline-flex;align-items:center;gap:2px;font-weight:500;}
.fc-ok{background:#dcfce7;color:#166534;}
.fc-no{background:#fef3c7;color:#92400e;}

/* ── 통계박스 ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.stat-cell{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r-md);padding:14px 8px;text-align:center;}
.stat-n{font-size:26px;font-weight:700;color:var(--g8);}
.stat-l{font-size:11px;color:var(--txt2);margin-top:2px;}

/* ── PAGINATION ── */
.pager{display:flex;align-items:center;justify-content:center;gap:6px;padding-top:14px;}
.pg-btn{width:30px;height:30px;border:1px solid var(--bdr);border-radius:7px;background:var(--surf);color:var(--txt2);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;}
.pg-btn:hover:not(:disabled){border-color:var(--g4);color:var(--g8);}
.pg-btn.on{background:var(--g8);color:#fff;border-color:var(--g8);}
.pg-btn:disabled{opacity:.4;cursor:not-allowed;}
.pg-info{font-size:12px;color:var(--txt2);}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:none;align-items:center;justify-content:center;padding:16px;}
.overlay.show{display:flex;}
.modal{background:var(--surf);border-radius:var(--r-lg);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal-head{padding:20px 20px 14px;border-bottom:1px solid var(--bdr);position:sticky;top:0;background:var(--surf);z-index:2;}
.modal-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 9px;border-radius:10px;font-weight:500;margin-bottom:8px;}
.modal-title{font-size:18px;font-weight:700;margin-bottom:2px;}
.modal-sub{font-size:12px;color:var(--txt2);}
.modal-close{position:absolute;top:14px;right:14px;width:28px;height:28px;border:1px solid var(--bdr);border-radius:7px;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--txt2);font-size:18px;}
.modal-body{padding:18px 20px 24px;}
.d-row{display:flex;gap:10px;margin-bottom:12px;align-items:flex-start;}
.d-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.d-label{font-size:11px;color:var(--txt3);margin-bottom:1px;}
.d-val{font-size:13px;color:var(--txt1);font-weight:500;line-height:1.5;}
.divider{border:none;border-top:1px solid var(--bdr);margin:14px 0;}
.facility-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:8px;}
.fc-item{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:var(--r-sm);font-size:12px;font-weight:500;}
.fc-item i{font-size:14px;}
.fc-green{background:#dcfce7;color:#166534;}
.fc-yellow{background:#fef3c7;color:#92400e;}
.tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
.tag{font-size:11px;padding:3px 9px;border-radius:7px;background:var(--bg);color:var(--txt2);border:1px solid var(--bdr);}
.sns-link{color:var(--purple);font-size:12px;display:inline-flex;align-items:center;gap:4px;text-decoration:none;}
.sns-link:hover{text-decoration:underline;}
.info-notice{background:var(--teal0);color:var(--teal);border-radius:var(--r-sm);padding:10px 12px;font-size:12px;margin-top:10px;}
.kopis-link{color:var(--purple);font-size:12px;display:inline-flex;align-items:center;gap:5px;text-decoration:none;background:var(--purple0);padding:6px 12px;border-radius:var(--r-sm);}
.kopis-link:hover{background:#ddd6fe;}

/* ── EMPTY ── */
.empty{text-align:center;padding:48px 16px;color:var(--txt3);}
.empty i{font-size:44px;display:block;margin-bottom:10px;opacity:.25;}

/* ── LANDING ── */
.landing{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:72px 24px;text-align:center;min-height:400px;}
.landing i{font-size:56px;color:var(--g4);margin-bottom:16px;}
.landing h2{font-size:18px;font-weight:700;color:var(--g9);margin-bottom:8px;}
.landing p{font-size:13px;color:var(--txt2);line-height:1.8;}

/* ── HIDDEN ── */
.hidden{display:none!important;}

@media(max-width:768px){
  .sidenav{display:none;}
  .gu-grid{grid-template-columns:repeat(5,1fr);}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .card-grid{grid-template-columns:1fr;}
  .content-inner{padding:16px 14px 40px;}
  .hpills{display:none;}
}

/* ── 리뷰 섹션 ── */
.review-wrap{margin-top:20px;border-top:1px solid var(--bdr);padding-top:16px;}
.review-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.review-title{font-size:13px;font-weight:700;color:var(--txt1);display:flex;align-items:center;gap:6px;}
.review-count{font-size:11px;color:var(--txt3);}
.btn-write{height:30px;padding:0 12px;border:1px solid var(--g4);border-radius:var(--r-sm);background:none;color:var(--g8);font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:inherit;transition:all .12s;}
.btn-write:hover{background:var(--g0);}
.btn-write.open{background:var(--g1);border-color:var(--g6);}

/* 별점 */
.stars-row{display:flex;gap:3px;margin-bottom:10px;}
.star{font-size:24px;cursor:pointer;color:#D1D5DB;transition:color .1s;line-height:1;user-select:none;}
.star.on,.star.hover{color:#FBBF24;}

/* 리뷰 작성 폼 */
.review-form{background:var(--g0);border:1px solid var(--g1);border-radius:var(--r-md);padding:14px;margin-bottom:14px;display:none;}
.review-form.show{display:block;}
.form-label{font-size:11px;font-weight:500;color:var(--txt2);margin-bottom:5px;}
.form-inp{width:100%;border:1px solid var(--bdr);border-radius:var(--r-sm);padding:7px 10px;font-size:13px;font-family:inherit;background:var(--surf);color:var(--txt1);margin-bottom:8px;}
.form-inp:focus{outline:none;border-color:var(--g4);}
textarea.form-inp{resize:vertical;min-height:72px;line-height:1.5;}
.tag-select{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.rtag{font-size:11px;padding:4px 10px;border-radius:20px;cursor:pointer;border:1px solid var(--bdr);background:var(--surf);color:var(--txt2);transition:all .12s;user-select:none;}
.rtag.on{background:var(--g1);color:var(--g8);border-color:var(--g4);font-weight:500;}
.rtag-red.on{background:#fee2e2;color:#991b1b;border-color:#fca5a5;}
.rtag-blue.on{background:var(--sky0);color:var(--sky);border-color:#7dd3fc;}
.rtag-amber.on{background:var(--amber0);color:var(--amber);border-color:#fcd34d;}
.form-btns{display:flex;gap:6px;justify-content:flex-end;}
.btn-cancel-sm{height:30px;padding:0 12px;border:1px solid var(--bdr);border-radius:var(--r-sm);background:none;color:var(--txt2);font-size:12px;cursor:pointer;font-family:inherit;}
.btn-submit-sm{height:30px;padding:0 14px;border:none;border-radius:var(--r-sm);background:var(--g8);color:#fff;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .12s;}
.btn-submit-sm:hover{background:var(--g9);}

/* 리뷰 아이템 */
.review-list{display:flex;flex-direction:column;gap:8px;}
.review-item{background:var(--bg);border-radius:var(--r-md);padding:10px 12px;}
.review-item-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.reviewer{display:flex;align-items:center;gap:7px;}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--g2);color:var(--g9);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.reviewer-name{font-size:12px;font-weight:500;color:var(--g8);}
.review-date{font-size:10px;color:var(--txt3);}
.review-stars{color:#FBBF24;font-size:13px;letter-spacing:1px;margin-bottom:4px;}
.review-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:5px;}
.rv-tag{font-size:10px;padding:2px 7px;border-radius:6px;background:var(--g1);color:var(--g8);}
.rv-tag-red{background:#fee2e2;color:#991b1b;}
.rv-tag-blue{background:var(--sky0);color:var(--sky);}
.rv-tag-amber{background:var(--amber0);color:var(--amber);}
.review-text{font-size:12px;color:var(--txt1);line-height:1.6;}
.review-empty{font-size:12px;color:var(--txt3);text-align:center;padding:16px 0;}
.review-del{background:none;border:none;cursor:pointer;color:var(--txt3);font-size:12px;padding:2px 4px;border-radius:4px;}
.review-del:hover{color:var(--red);background:var(--red0);}

/* 카드 리뷰 뱃지 */
.card-review-badge{position:absolute;bottom:10px;left:14px;font-size:10px;color:var(--txt3);display:flex;align-items:center;gap:3px;}
.card-review-badge .star-mini{color:#FBBF24;}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">
    <div class="logo-mark">🌿</div>
    <h1>서울 가족 나들이 플래너</h1>
    <span>Seoul Family Outing</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <input class="search-inp" type="text" id="searchInp" placeholder="🔍 장소, 메뉴, 주소 검색..." oninput="onSearch()">
    <div class="hpills">
      <span class="hpill"><i class="ti ti-database"></i>공공데이터</span>
      <span class="hpill"><i class="ti ti-wheelchair"></i>무장애</span>
      <span class="hpill"><i class="ti ti-baby-carriage"></i>유아차</span>
    </div>
  </div>
</header>

<!-- HERO: 구 선택 -->
<div class="hero" id="heroSec">
  <div class="hero-inner">
    <div class="hero-title">🗺️ 어느 구로 나들이 갈까요?</div>
    <div class="hero-sub">구를 선택하면 모범음식점 · 공원 · 책방 · 산책길 · 편의시설 정보를 한눈에 확인할 수 있어요</div>
    <div class="gu-grid" id="guGrid"></div>
  </div>
</div>

<!-- BREADCRUMB -->
<div class="breadcrumb hidden" id="breadcrumb">
  <i class="ti ti-home" style="font-size:12px;"></i>
  <i class="ti ti-chevron-right" style="font-size:11px;"></i>
  <span class="bc-cur" id="bcGu"></span>
</div>

<!-- LAYOUT -->
<div class="layout hidden" id="layoutArea">

  <!-- SIDENAV -->
  <nav class="sidenav" id="sideNav">
    <div class="snav-head">
      <div class="snav-gu"><i class="ti ti-map-pin" style="font-size:15px;"></i><span id="navGuName"></span></div>
      <div class="snav-total" id="navTotal"></div>
    </div>
    <div class="snav-items" id="navItems"></div>
    <div class="snav-footer">
      <button class="btn-back" onclick="goHome()"><i class="ti ti-arrow-left" style="font-size:12px;"></i> 구 다시 선택</button>
    </div>
  </nav>

  <!-- CONTENT -->
  <div class="content">
    <div class="content-inner" id="contentInner">
      <div class="landing"><i class="ti ti-map-search"></i><h2>구를 선택해주세요</h2></div>
    </div>
  </div>

</div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="closeOut(event)">
  <div class="modal" id="modal">
    <div class="modal-head">
      <div class="modal-badge" id="mBadge"></div>
      <div class="modal-title" id="mTitle"></div>
      <div class="modal-sub" id="mSub"></div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>

const GUS = ['강남구','강동구','강북구','강서구','관악구','광진구','구로구','금천구','노원구','도봉구','동대문구','동작구','마포구','서대문구','서초구','성동구','성북구','송파구','양천구','영등포구','용산구','은평구','종로구','중구','중랑구'];
let CUR_GU = null, QUERY = '', PAGES = {};
const PG = 9;

// ══════════════════════════════════════════════════════════════════
// 데이터 조회
// ══════════════════════════════════════════════════════════════════
function getData(gu, src) {
  switch(src) {
    case 'db_restaurants': return DB.restaurants.filter(r=>r.gu===gu);
    case 'db_bookstores':  return DB.bookstores.filter(r=>r.gu===gu);
    case 'db_trails':      return DB.trails.filter(r=>r.gu===gu);
    case 'db_culture':     return DB.culture.filter(r=>r.gu===gu);
    case 'legacy_park':    return LEGACY.filter(r=>r.gu===gu);
    case 'parking':        return PARKING.filter(r=>r.gu===gu);
    case 'nursing':        return NURSING.filter(r=>r.gu===gu);
    case 'stroller':       return STROLLER.filter(r=>r.gu===gu);
    case 'hospital':       return HOSPITALS.filter(r=>r.gu===gu);
    case 'kopis':          return []; // KOPIS 링크 안내
    default: return [];
  }
}

function getGuTotal(gu) {
  return SECTIONS.reduce((s, sec) => s + getData(gu, sec.src).length, 0);
}

// ══════════════════════════════════════════════════════════════════
// 구 그리드
// ══════════════════════════════════════════════════════════════════
function renderGuGrid() {
  document.getElementById('guGrid').innerHTML = GUS.map(g => {
    const cnt = getGuTotal(g);
    return `<button class="gu-btn${CUR_GU===g?' active':''}" onclick="selectGu('${g}')">
      ${g.replace('구','')}
      <small>${cnt}건</small>
    </button>`;
  }).join('');
}

// ══════════════════════════════════════════════════════════════════
// 구 선택
// ══════════════════════════════════════════════════════════════════
function selectGu(gu) {
  CUR_GU = gu; QUERY = ''; PAGES = {};
  document.getElementById('searchInp').value = '';
  renderGuGrid();
  document.getElementById('breadcrumb').classList.remove('hidden');
  document.getElementById('bcGu').textContent = gu;
  document.getElementById('layoutArea').classList.remove('hidden');
  renderSideNav(gu);
  renderContent(gu);
  document.getElementById('layoutArea').scrollIntoView({behavior:'smooth',block:'start'});
}

function goHome() {
  CUR_GU = null;
  document.getElementById('layoutArea').classList.add('hidden');
  document.getElementById('breadcrumb').classList.add('hidden');
  renderGuGrid();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ══════════════════════════════════════════════════════════════════
// 사이드 내비
// ══════════════════════════════════════════════════════════════════
function renderSideNav(gu) {
  document.getElementById('navGuName').textContent = gu;
  const total = getGuTotal(gu);
  document.getElementById('navTotal').textContent = `총 ${total}건 정보`;
  document.getElementById('navItems').innerHTML = SECTIONS.map(s => {
    const cnt = getData(gu, s.src).length + (s.src==='kopis'?1:0);
    if (!cnt) return '';
    return `<div class="snav-item" id="snav-${s.id}" onclick="jumpTo('${s.id}')">
      <div class="snav-icon" style="background:${s.bg};color:${s.color};"><i class="ti ${s.icon}"></i></div>
      <span>${s.label}</span>
      <span class="snav-badge" style="background:${s.bg};color:${s.color};">${s.src==='kopis'?'↗':cnt}</span>
    </div>`;
  }).join('');
}

function jumpTo(id) {
  document.querySelectorAll('.snav-item').forEach(e=>e.classList.remove('on'));
  const ni = document.getElementById('snav-'+id);
  if(ni) ni.classList.add('on');
  const el = document.getElementById('sec-'+id);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}

// ══════════════════════════════════════════════════════════════════
// 콘텐츠 전체 렌더
// ══════════════════════════════════════════════════════════════════
function renderContent(gu) {
  let html = '';
  SECTIONS.forEach(s => {
    const raw = getData(gu, s.src);
    if (s.src === 'kopis') { html += renderKopisSection(s, gu); return; }
    if (s.src === 'db_culture') { if(raw.length) html += renderCultureSection(s, raw); return; }
    if (!raw.length) return;
    html += renderSection(s, raw, gu);
  });
  if (!html) html = `<div class="empty"><i class="ti ti-mood-sad"></i><p><strong>${gu}</strong>에 해당하는 데이터가 아직 없습니다.</p></div>`;
  document.getElementById('contentInner').innerHTML = html;
}

// ══════════════════════════════════════════════════════════════════
// 섹션 렌더
// ══════════════════════════════════════════════════════════════════
function renderSection(s, raw, gu) {
  const page = PAGES[s.id] || 1;
  const items = QUERY ? raw.filter(it=>JSON.stringify(it).toLowerCase().includes(QUERY)) : raw;
  const total = items.length;
  if (!total) return '';
  const totalPg = Math.ceil(total/PG);
  const slice = items.slice((page-1)*PG, page*PG);
  const cards = slice.map(it => renderCard(it, s)).join('');
  const pager = total > PG ? renderPager(s.id, page, totalPg, total) : '';
  return `<div class="section" id="sec-${s.id}">
    <div class="sec-header">
      <div class="sec-title">
        <div class="sec-icon" style="background:${s.bg};color:${s.color};"><i class="ti ${s.icon}"></i></div>

      </div>
      <span class="sec-count">${total}건</span>
    </div>
    <div class="card-grid">${cards}</div>
    ${pager}
  </div>`;
}

    ${inner}

function freeClass(fee) { return fee&&fee.includes('무료')?'fc-ok':''; }

function reviewBadge(key) {
  try {
    const reviews = JSON.parse(localStorage.getItem(key) || '[]');
    if (!reviews.length) return '';
    const avg = (reviews.reduce((s,r)=>s+r.rating,0)/reviews.length).toFixed(1);
    return `<div class="card-review-badge"><span class="star-mini">★</span>${avg} <span>(${reviews.length})</span></div>`;
  } catch { return ''; }
}

// ══════════════════════════════════════════════════════════════════
// 페이지네이션
// ══════════════════════════════════════════════════════════════════
function renderPager(sid, cur, total, cnt) {
  let s = Math.max(1, cur-2), e = Math.min(total, s+4);
  if (e-s<4) s=Math.max(1,e-4);
  let btns = '';
  for(let i=s;i<=e;i++) btns+=`<button class="pg-btn${i===cur?' on':''}" onclick="flipPage('${sid}',${i})">${i}</button>`;
  const prev = cur>1?`<button class="pg-btn" onclick="flipPage('${sid}',${cur-1})"><i class="ti ti-chevron-left"></i></button>`:`<button class="pg-btn" disabled><i class="ti ti-chevron-left"></i></button>`;
  const next = cur<total?`<button class="pg-btn" onclick="flipPage('${sid}',${cur+1})"><i class="ti ti-chevron-right"></i></button>`:`<button class="pg-btn" disabled><i class="ti ti-chevron-right"></i></button>`;
  return `<div class="pager">${prev}${btns}${next}<span class="pg-info" style="margin-left:4px;">/ ${total}p (${cnt}건)</span></div>`;
}

function flipPage(sid, pg) {
  PAGES[sid] = pg;
  const s = SECTIONS.find(x=>x.id===sid);
  if(!s||!CUR_GU) return;
  const raw = getData(CUR_GU, s.src);
  const el = document.getElementById('sec-'+sid);
  if (!el) return;
  el.outerHTML = renderSection(s, raw, CUR_GU);
  document.getElementById('sec-'+sid).scrollIntoView({behavior:'smooth',block:'start'});
}

// localStorage key 생성 — 장소명+구로 유니크 식별
function placeKey(item) {
  return 'rv__' + (item.name||'') + '__' + (item.gu||'');
}

// localStorage 저장/로드
function loadReviews(key) {
  try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch { return []; }
}
function saveReviews(key, arr) {
  try { localStorage.setItem(key, JSON.stringify(arr)); } catch {}
}

// 리뷰 섹션 HTML 생성
const REVIEW_TAGS = [
  {id:'yezkids',  label:'예스키즈 ✅',  cls:''},
  {id:'nokids',   label:'노키즈존 ❌',  cls:'rtag-red'},
  {id:'stroller', label:'유아차OK 🛒',  cls:'rtag-blue'},
  {id:'nursing',  label:'수유실있음 🍼', cls:'rtag-blue'},
  {id:'parking',  label:'주차편리 🚗',  cls:''},
  {id:'clean',    label:'청결양호 ✨',  cls:''},
  {id:'wait',     label:'대기있음 ⏳',  cls:'rtag-amber'},
  {id:'kidsmenu', label:'아이메뉴 🍱',  cls:''},
  {id:'tasty',    label:'어른도맛있음 😋', cls:''},
];

function reviewSection(key) {
  const reviews = loadReviews(key);
  const avg = reviews.length
    ? (reviews.reduce((s,r)=>s+r.rating,0)/reviews.length).toFixed(1)
    : null;

  const listHtml = reviews.length
    ? reviews.map((r,i) => reviewItemHtml(r, i, key)).join('')
    : '<div class="review-empty"><i class="ti ti-message-off" style="font-size:22px;display:block;margin-bottom:4px;opacity:.3;"></i>아직 리뷰가 없어요.<br>첫 번째 리뷰를 남겨보세요!</div>';

  return `
  <div class="review-wrap" id="reviewWrap">
    <div class="review-head">
      <div class="review-title">
        <i class="ti ti-message-circle" style="font-size:15px;color:var(--g4);"></i>
        방문 리뷰
        ${avg ? `<span style="color:#FBBF24;font-size:13px;">★ ${avg}</span>` : ''}
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="review-count">${reviews.length}개</span>
        <button class="btn-write" id="btnWrite" onclick="toggleForm()">
          <i class="ti ti-pencil" style="font-size:12px;"></i> 리뷰 쓰기
        </button>
      </div>
    </div>

    <!-- 작성 폼 -->
    <div class="review-form" id="reviewForm">
      <div class="form-label">닉네임</div>
      <input class="form-inp" id="rvNick" type="text" placeholder="예: 맑은하늘맘" maxlength="12">

      <div class="form-label">별점</div>
      <div class="stars-row" id="starRow">
        <span class="star" data-v="1" onclick="setStar(1)" onmouseenter="hoverStar(1)" onmouseleave="unhoverStar()">★</span>
        <span class="star" data-v="2" onclick="setStar(2)" onmouseenter="hoverStar(2)" onmouseleave="unhoverStar()">★</span>
        <span class="star" data-v="3" onclick="setStar(3)" onmouseenter="hoverStar(3)" onmouseleave="unhoverStar()">★</span>
        <span class="star" data-v="4" onclick="setStar(4)" onmouseenter="hoverStar(4)" onmouseleave="unhoverStar()">★</span>
        <span class="star" data-v="5" onclick="setStar(5)" onmouseenter="hoverStar(5)" onmouseleave="unhoverStar()">★</span>
      </div>

      <div class="form-label">태그 선택 (중복 가능)</div>
      <div class="tag-select" id="tagSelect">
        ${REVIEW_TAGS.map(t=>`<span class="rtag ${t.cls}" data-id="${t.id}" onclick="toggleTag(this)">${t.label}</span>`).join('')}
      </div>

      <div class="form-label">리뷰 내용</div>
      <textarea class="form-inp" id="rvText" placeholder="방문 경험을 자유롭게 남겨주세요 (최대 150자)" maxlength="150"></textarea>

      <div class="form-btns">
        <button class="btn-cancel-sm" onclick="toggleForm()">취소</button>
        <button class="btn-submit-sm" onclick="submitReview('${key}')">등록하기</button>
      </div>
    </div>

    <!-- 리뷰 목록 -->
    <div class="review-list" id="reviewList">${listHtml}</div>
  </div>`;
}

function reviewItemHtml(r, i, key) {
  const stars = '★'.repeat(r.rating) + '☆'.repeat(5-r.rating);
  const tagHtml = (r.tags||[]).map(tid => {
    const def = REVIEW_TAGS.find(x=>x.id===tid);
    if (!def) return '';
    const cls = def.cls === 'rtag-red' ? 'rv-tag-red' : def.cls === 'rtag-blue' ? 'rv-tag-blue' : def.cls === 'rtag-amber' ? 'rv-tag-amber' : '';
    return `<span class="rv-tag ${cls}">${def.label}</span>`;
  }).join('');
  return `<div class="review-item" id="rvi-${i}">
    <div class="review-item-head">
      <div class="reviewer">
        <div class="avatar">${(r.nick||'?')[0]}</div>
        <span class="reviewer-name">${esc(r.nick)}</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <span class="review-date">${r.date}</span>
        <button class="review-del" onclick="deleteReview('${key}',${i})" title="삭제"><i class="ti ti-trash" style="font-size:12px;"></i></button>
      </div>
    </div>
    <div class="review-stars">${stars}</div>
    ${tagHtml ? `<div class="review-tags">${tagHtml}</div>` : ''}
    <div class="review-text">${esc(r.text)}</div>
  </div>`;
}

// 폼 토글
let _star = 0;
function toggleForm() {
  const form = document.getElementById('reviewForm');
  const btn  = document.getElementById('btnWrite');
  const isOpen = form.classList.contains('show');
  form.classList.toggle('show');
  btn.classList.toggle('open');
  if (!isOpen) {
    // 초기화
    _star = 0;
    document.getElementById('rvNick').value = '';
    document.getElementById('rvText').value = '';
    document.querySelectorAll('#starRow .star').forEach(s=>s.classList.remove('on','hover'));
    document.querySelectorAll('#tagSelect .rtag').forEach(t=>t.classList.remove('on'));
  }
}

// 별점
function setStar(v) {
  _star = v;
  document.querySelectorAll('#starRow .star').forEach(s => {
    s.classList.toggle('on', parseInt(s.dataset.v) <= v);
  });
}
function hoverStar(v) {
  document.querySelectorAll('#starRow .star').forEach(s => {
    s.classList.toggle('hover', parseInt(s.dataset.v) <= v);
  });
}
function unhoverStar() {
  document.querySelectorAll('#starRow .star').forEach(s => s.classList.remove('hover'));
}

// 태그 토글
function toggleTag(el) { el.classList.toggle('on'); }

// 리뷰 등록
function submitReview(key) {
  const nick = document.getElementById('rvNick').value.trim();
  const text = document.getElementById('rvText').value.trim();
  if (!nick) { alert('닉네임을 입력해주세요.'); return; }
  if (!_star) { alert('별점을 선택해주세요.'); return; }
  if (!text)  { alert('리뷰 내용을 입력해주세요.'); return; }

  const tags = [...document.querySelectorAll('#tagSelect .rtag.on')].map(el=>el.dataset.id);
  const d = new Date();
  const date = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;

  const reviews = loadReviews(key);
  reviews.unshift({ nick, rating: _star, tags, text, date });
  saveReviews(key, reviews);

  // 리뷰 섹션만 갱신
  const wrap = document.getElementById('reviewWrap');
  if (wrap) wrap.outerHTML = reviewSection(key);

  // 카드도 갱신 (리뷰 뱃지)
  if (CUR_GU) refreshCardBadge(window._curItem);
}

// 리뷰 삭제
function deleteReview(key, idx) {
  if (!confirm('이 리뷰를 삭제하시겠습니까?')) return;
  const reviews = loadReviews(key);
  reviews.splice(idx, 1);
  saveReviews(key, reviews);
  const wrap = document.getElementById('reviewWrap');
  if (wrap) wrap.outerHTML = reviewSection(key);
  if (CUR_GU) refreshCardBadge(window._curItem);
}

// 카드 내 리뷰 뱃지 갱신
function refreshCardBadge(item) {
  if (!item) return;
  const key = placeKey(item);
  const reviews = loadReviews(key);
  if (!reviews.length) return;
  const avg = (reviews.reduce((s,r)=>s+r.rating,0)/reviews.length).toFixed(1);
  // 카드 찾아서 뱃지 업데이트
  document.querySelectorAll('.card').forEach(card => {
    const nameEl = card.querySelector('.card-name');
    if (nameEl && nameEl.textContent.trim() === (item.name||'').replace(/&amp;/g,'&')) {
      let badge = card.querySelector('.card-review-badge');
      if (!badge) {
        badge = document.createElement('div');
        badge.className = 'card-review-badge';
        card.appendChild(badge);
      }
      badge.innerHTML = `<span class="star-mini">★</span>${avg} <span style="color:var(--txt3);">(${reviews.length})</span>`;
    }
  });
}

function drows(rows) {
  return rows.map(r=>`<div class="d-row">
    <div class="d-icon" style="background:${r.bg};color:${r.col};"><i class="ti ${r.icon}"></i></div>
    <div><div class="d-label">${r.label}</div><div class="d-val">${esc(r.val||'-')}</div></div>
  </div>`).join('');
}

function fcItem(ok, icon, yes, no) {
  return `<div class="fc-item ${ok?'fc-green':'fc-yellow'}">
    <i class="ti ${icon}"></i>${ok?yes:no}
  </div>`;
}

function closeModal() {
  document.getElementById('overlay').classList.remove('show');
  document.body.style.overflow='';
}
function closeOut(e){ if(e.target===document.getElementById('overlay')) closeModal(); }

// 유틸
// ══════════════════════════════════════════════════════════════════
function esc(s){ if(!s||s==='nan'||s==='None') return '-'; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function safeJson(obj){ return JSON.stringify(obj).replace(/'/g,'&#39;'); }

renderGuGrid();
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

</script>
